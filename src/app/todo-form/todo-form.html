<div class="relative flex items-center w-full">
  <input 
    class="w-full bg-zinc-950/50 border border-zinc-800 rounded-xl py-3 pl-4 pr-24 text-zinc-100 placeholder-zinc-600 outline-none transition-colors focus:bg-zinc-950 focus:border-zinc-600 text-base" 
    type="text" 
    placeholder="What needs to be done?"
    [ngModel]="taskModel().title" 
    (ngModelChange)="taskModel.update(m => ({...m, title: $event}))"
    (keyup.enter)="handleSubmit()"
  />
  <button 
    class="absolute right-1.5 bg-zinc-100 hover:bg-white text-zinc-900 font-medium py-1.5 px-4 rounded-lg transition-colors text-sm"
    (click)="handleSubmit()">
    Add
  </button>
</div>
